# PnL Lens — development stack (backend-v2 Phase 2). Run from the repo root:
#   npm run stack:env     # once: fills .env with random secrets
#   npm run stack:up      # build + start, waits until healthy
#   npm run test:stack    # proves the isolation rules
# Open http://localhost:8080. Only Caddy publishes a port; everything else is on private networks.
# Optional debugging ports (127.0.0.1 only): add  -f infra/compose.dev.ports.yml
name: pnl-lens

x-tz: &tz
  TZ: Asia/Kolkata

# Container hardening for the app services (Phase 7): read-only root filesystem, no privilege escalation,
# no Linux capabilities, a small writable /tmp. Data services keep their volumes.
x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  # ---------------------------------------------------------------- edge
  caddy:
    <<: *hardened
    cap_add: [NET_BIND_SERVICE]               # binds :80 inside the container
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 256m
    image: caddy:2.11.4-alpine
    ports: ["${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"]
    environment:
      SITE_ADDRESS: ":80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      retries: 6
    restart: unless-stopped

  web:
    <<: *hardened
    tmpfs: ["/tmp:size=64m", "/app/apps/web/.next/cache:uid=1000,gid=1000,size=128m"]
    mem_limit: 768m
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    image: pnl-lens/web:dev
    environment:
      <<: *tz
      AUTH_MODE: dev                          # shows/hides the logout button only; the API owns sessions
      API_INTERNAL_URL: http://api:4000       # server-side calls to the API (forwarding the visitor's cookie)
      APP_URL: http://localhost:${HTTP_PORT:-8080}
    # Since the Phase 6 cutover the web app has no database access and no API routes: edge network only.
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    <<: *hardened
    tmpfs: ["/tmp:size=64m", "/app/.data:uid=1000,gid=1000,mode=0700,size=16m"]   # .data: console mail log (dev only)
    mem_limit: 768m
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    image: pnl-lens/api:dev
    environment:
      <<: *tz
      DATABASE_URL: postgres://lens_app:${LENS_APP_PASSWORD:?run npm run stack:env}@postgres:5432/lens
      REDIS_URL: redis://:${REDIS_PASSWORD:?run npm run stack:env}@redis:6379
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: statements
      S3_ACCESS_KEY_ID: ${S3_API_ACCESS_KEY_ID:?run npm run stack:env}
      S3_SECRET_ACCESS_KEY: ${S3_API_SECRET_ACCESS_KEY:?run npm run stack:env}
      AUTH_MODE: dev
      ALLOW_DEV_AUTH_IN_PROD: "true"          # dev stack only (same as web): every request is the seeded dev user
      SESSION_SECRET: ${SESSION_SECRET:?run npm run stack:env}
      OTP_PEPPER: ${OTP_PEPPER:?run npm run stack:env}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?run npm run stack:env}
      FILE_KEK_ID: ${FILE_KEK_ID:?run npm run stack:env}
      FILE_KEK_K1: ${FILE_KEK_K1:?run npm run stack:env}
      APP_URL: http://localhost:${HTTP_PORT:-8080}
      EXTRA_ALLOWED_ORIGINS: http://127.0.0.1:${HTTP_PORT:-8080}   # the same dev site opened by IP (a different origin to the browser)
      MAIL_DRIVER: ${DEV_MAIL_DRIVER:-console}   # console = codes in .data/dev-mail.log; set DEV_MAIL_DRIVER=smtp in .env to really send
      MAIL_FROM: ${MAIL_FROM:-PnL Lens <no-reply@localhost>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      PAYMENTS_MODE: "off"
      EXPOSE_OPENAPI: "true"                  # dev only: GET /api/v1/openapi.json
    networks: [edge, internal]             # edge = egress for email, Google, Razorpay
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    develop:
      watch:
        - { action: rebuild, path: ../apps/api/src }
        - { action: rebuild, path: ../packages/db/src }
        - { action: rebuild, path: ../packages/shared/src }

  # ---------------------------------------------------------------- internal only (no internet)
  worker:
    <<: *hardened
    tmpfs: ["/tmp:size=128m"]
    mem_limit: 2g                             # 2 jobs x 512 MB engine child + the worker itself
    build: { context: .., dockerfile: infra/docker/worker.Dockerfile }
    image: pnl-lens/worker:dev
    environment:
      <<: *tz
      DATABASE_URL: postgres://lens_worker:${LENS_WORKER_PASSWORD:?run npm run stack:env}@postgres:5432/lens
      REDIS_URL: redis://:${REDIS_PASSWORD:?run npm run stack:env}@redis:6379
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: statements
      S3_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:?run npm run stack:env}
      S3_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:?run npm run stack:env}
      FILE_KEK_ID: ${FILE_KEK_ID:?run npm run stack:env}
      FILE_KEK_K1: ${FILE_KEK_K1:?run npm run stack:env}
      WORKER_CONCURRENCY: "2"
      ENGINE_TIMEOUT_MS: "60000"
      ENGINE_MEMORY_MB: "512"
    networks: [internal]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    develop:
      watch:
        - { action: rebuild, path: ../apps/worker/src }
        - { action: rebuild, path: ../packages/engine/src }
        - { action: rebuild, path: ../packages/db/src }

  postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lens_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run npm run stack:env}
      POSTGRES_DB: lens
      # Passwords for every connection, including from inside this container (the image otherwise trusts
      # local/loopback connections). Applies when the data volume is first initialised.
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d lens"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    # AOF persistence + noeviction (BullMQ requirement); password required for every client.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?run npm run stack:env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run npm run stack:env}   # lets the healthcheck's redis-cli authenticate
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run npm run stack:env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?run npm run stack:env}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # ---------------------------------------------------------------- one-off jobs
  migrate:
    build: { context: .., dockerfile: infra/docker/tools.Dockerfile }
    image: pnl-lens/tools:dev
    command: ["sh", "-c", "node packages/db/scripts/migrate.mjs && node packages/db/scripts/setup-roles.mjs && node packages/db/scripts/seed-dev.mjs"]
    environment:
      MIGRATE_DATABASE_URL: postgres://${POSTGRES_USER:-lens_admin}:${POSTGRES_PASSWORD:?run npm run stack:env}@postgres:5432/lens
      LENS_APP_PASSWORD: ${LENS_APP_PASSWORD:?run npm run stack:env}
      LENS_WORKER_PASSWORD: ${LENS_WORKER_PASSWORD:?run npm run stack:env}
      SEED_DEV_DATA: "true"                   # dev only: dev user with 5 credits
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  storage-init:
    build: { context: .., dockerfile: infra/docker/tools.Dockerfile }   # same image as migrate (cached)
    image: pnl-lens/tools:dev
    command: ["node", "infra/scripts/storage-init.mjs"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?run npm run stack:env}
      S3_BUCKET: statements
      STORAGE_CAPACITY_BYTES: "10000000000"
      S3_API_ACCESS_KEY_ID: ${S3_API_ACCESS_KEY_ID:?run npm run stack:env}
      S3_API_SECRET_ACCESS_KEY: ${S3_API_SECRET_ACCESS_KEY:?run npm run stack:env}
      S3_WORKER_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:?run npm run stack:env}
      S3_WORKER_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:?run npm run stack:env}
    networks: [internal]
    depends_on:
      garage: { condition: service_healthy }
    restart: "no"

networks:
  edge: {}
  internal:
    internal: true          # no route to the internet

volumes:
  pgdata:
  redisdata:
  garage_meta:
  garage_data:
  caddy_data:
  caddy_config:
